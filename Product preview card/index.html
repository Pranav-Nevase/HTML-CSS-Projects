<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Montserrat:wght@500;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            font-weight: 500;
            background-color: hsl(30, 38%, 92%);
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            font-family: 'Fraunces', serif;
            font-weight: 700;
        }
    </style>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <!-- main  -->


    <div class="main">
        <!-- image -->
        <div class="image">
            <picture>
                <source media="(min-width: 601px)" srcset="./assets/image-product-desktop.jpg">
                <img src="./assets/image-product-mobile.jpg" alt="Perfume">
            </picture>

        </div>

        <!--  -->

        <div class="brief">
            <p class="para" id="Perfume">PERFUME</p>

            <h1 class="h1">Gabrielle <br class="desktop-break"> Essence Eau <br class="desktop-break">De Parfum</h1>

            <p class="para" id="desp">A floral, solar and voluptuous interpretation composed by Olivier Polge,
                Perfumer-Creator for the House of CHANEL.</p>

            <!-- price -->
            <div class="price-container">
                <span class="price">$149.99</span>
                <s class="old-price">$169.99</s>


            </div>

            <!-- button -->
            <button class="button">
                <i class="fa-solid fa-cart-shopping"></i>
                <span style="color: white; font-size:medium;">Add to cart</span>
            </button>

        </div>


    </div>

</body>

</html>
