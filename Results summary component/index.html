<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./index.css">
</head>

<body>



    <!-- main -->

    <div class="main">

        <div class="your_result">
            <h2 id="h2">Your Result</h2>
            <div class="score-circle">
                <h1>76</h1>
                <p>of 100</p>
            </div>
            <h2>Great</h2>

            <p class="description">You scored higher than 65% the people who have take these tests.</p>

        </div>



        <div class="summary">

            <h2>Summary</h2>
            <div class="data" id="Reaction">
                <div class="title-group">
                    <img src="./assets/icon-reaction.svg" alt=""> 
                    <h5> Reaction</h5>
                </div>
                <p class="score"><strong>80</strong> <span>/ 100</span></p>
                
            </div>
            <div class="data" id="Memory">
                <div class="title-group">
                     <img src="./assets/icon-memory.svg" alt=""> 
                     <h5> Memory</h5>
                </div>
                <p class="score"><strong>92</strong> <span>/ 100</span></p>
                
            </div>
            <div class="data" id="Verbal">
                <div class="title-group">
                     <img src="./assets/icon-verbal.svg" alt=""> <h5>Verbal</h5>
                </div>
                <p class="score"><strong>61</strong> <span>/ 100</span></p>
            </div>
            <div class="data" id="Visual">
                <div class="title-group">
                     <img src="./assets/icon-visual.svg" alt="">
                      <h5> Visual</h5>
                </div>
                <p class="score"><strong>73</strong> <span>/ 100</span></p>
                
            </div>

            <!-- Button -->
            <div class="button">
                <button id="btn">Continue</button>
            </div>

        </div>
    </div>


        <!-- Js -->
      <script src="./index.js"></script>

</body>

</html>
