<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red bus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="./index.css">

</head>

<body class="m-0">


    <!-- Header  -->
    <header>

        <!-- Navbar -->

        <nav class="bg-white flex items-center gap-8 m-0">

            <!-- Logo -->
            <div class="w-[50px] h-[50px] shrink-0 mr-10 ml-20 mt-2">
                <a href="#">
                    <img class="w-full h-full object-contain" src="./assets/redbus_logo.png" alt="logo">
                </a>
            </div>



            <div class="flex w-full gap-8 m-2 justify-between">
                <div class="flex gap-6 ">
                    <div>
                        <a href="#">
                            <img class="w-[32px] h-[32px]" src="./assets/bus_logo.svg" alt="">
                            <p class="text-red-700 text-base">Bus Ticket</p>
                        </a>

                    </div>
                    <div>
                        <a href="#">
                            <img class="w-[32px] h-[32px]" src="./assets/train_logo.svg" alt="">
                            <p class="text-red-700 text-base">Train Ticket </p>
                        </a>
                    </div>
                    <div>
                        <a href="#">
                            <img class="w-[32px] h-[32px]" src="./assets/hotels_logo.svg" alt="">
                            <p class="text-red-700 text-base">Hotels </p>
                        </a>
                    </div>
                </div>
                <div class="flex items-center p-2 mx-8 mr-20 my-2 gap-4">
                    <div class="pr-6">
                        <a class="flex items-center gap-1 " href="#">
                            <i class="fa-solid fa-list"></i>
                            <span class="text-base">Bookings</span>
                        </a>
                    </div>
                    <div class="pr-6">
                        <a class="flex items-center gap-1 " href="#">
                            <i class="fa-regular fa-circle-question"></i>
                            <span class="text-base">Help</span>
                        </a>
                    </div>
                    <div>
                        <a class="flex items-center gap-1 " href="#">
                            <i class="fa-regular fa-circle-user"></i>
                            <span class="text-base">Account</span>
                        </a>
                    </div>

                </div>

            </div>

        </nav>

        <!-- Section -->

        <div>


            <!-- Background imgae  -->
            <div class="header_img">
                <h1 class=" px-16 pt-12 text-7xl font-bold leading-tight text-white">
                    India's No. 1 online bus ticket booking site
                </h1>


                <!--  -->

                <!-- Search bar -->

                <div class="flex w-fit h-fit flex-wrap items-center justify-center m-auto rounded-2xl bg-white mt-[225px] p-3 shadow-lg">
                    <div class="border border-black rounded-lg flex mr-2 ">

                        <!-- From -->
                        <div class="p-4 pr-10 border-r border-gray-300 self-stretch flex items-center">
                            <i class="fa-solid fa-bus-simple pr-3"></i>
                            <span class="block text-gray-400 ">From</span>

                        </div>
                        <!-- To -->
                        <div class="p-4 pr-10 border-r border-gray-300 self-stretch flex items-center">
                            <i class="fa-solid fa-bus-simple pr-3"></i>
                            <span class="block text-gray-400">To</span>
                        </div>
                        <!-- Date -->
                        <div class="p-4 pr-12 flex items-center">
                            <i class="fa-solid fa-calendar"></i>
                            <span class="text-gray-400 p-5">
                                date for journey
                            </span>

                            <div class="">
                                <button
                                    class="px-3 py-2 bg-[#fddbd6] border border-gray-200 rounded-full text-sm font-medium">Today</button>
                            </div>
                            <div class="">
                                <button
                                    class="px-3 py-2 bg-[#fddbd6] border border-gray-200 rounded-full text-sm font-medium">Tomorrow</button>
                            </div>
                        </div>
                    </div>
                    <div class="border border-black rounded-lg flex items-center p-3 ">
                        <img class="w-[20px] h-[20px] object-contain" src="./assets/female.svg" alt="">
                        <div class="p-3 flex flex-col">

                            <span class="mt-2">Booking for women</span>
                            <a href="#" class="text-blue-600 text-xs font-bold underline mt-1 flex">Know more</a>
                        </div>




                    </div>


                    <div class="mt-4 flex justify-center">
                        <button class="flex bg-red-500 rounded-full border-8 border-gray-200 px-16 py-4 shadow-lg text-white gap-4 ">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            Search buses
                        </button>
                    </div>




                </div>





            </div>
        </div>






    </header>




</body>

</html>
